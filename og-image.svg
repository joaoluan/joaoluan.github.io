<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">João Moura — Desenvolvedor Full Stack</title>
  <desc id="desc">Do salão ao servidor: SaaS, backend, automação e infraestrutura.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#17251f" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#17251f" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#edf1ee"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g transform="translate(74 66)">
    <circle cx="23" cy="23" r="22" fill="#17251f"/>
    <text x="23" y="28" text-anchor="middle" fill="#f5f2ea" font-family="Arial, sans-serif" font-size="13" font-weight="700">JM</text>
    <text x="58" y="29" fill="#17251f" font-family="Arial, sans-serif" font-size="20" font-weight="700">João Moura</text>
  </g>

  <g transform="translate(74 176)">
    <text x="0" y="0" fill="#17251f" font-family="Arial, sans-serif" font-size="68" font-weight="700">Do salão</text>
    <rect x="-8" y="24" width="392" height="78" rx="4" fill="#d64f3a" transform="rotate(-1 188 63)"/>
    <text x="10" y="84" fill="#ffffff" font-family="Arial, sans-serif" font-size="68" font-weight="700">ao servidor.</text>
    <text x="0" y="150" fill="#31433b" font-family="Arial, sans-serif" font-size="25">Full Stack · Backend · SaaS · Automação</text>
    <text x="0" y="195" fill="#5c6c65" font-family="Arial, sans-serif" font-size="20">Node.js · PostgreSQL · Docker · WhatsApp</text>
  </g>

  <g transform="translate(760 94) rotate(1)" filter="url(#shadow)">
    <rect width="350" height="438" rx="7" fill="#f5f2ea" stroke="#aebdb5"/>
    <circle cx="-1" cy="100" r="12" fill="#edf1ee" stroke="#aebdb5"/>
    <circle cx="351" cy="100" r="12" fill="#edf1ee" stroke="#aebdb5"/>
    <path d="M0 100H350" stroke="#aebdb5" stroke-dasharray="5 5"/>

    <text x="28" y="42" fill="#5c6c65" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1">FLUXO DE SERVIÇO</text>
    <text x="28" y="74" fill="#17251f" font-family="Arial, sans-serif" font-size="28" font-weight="700">MyFoodLink</text>
    <rect x="244" y="30" width="78" height="27" rx="3" fill="none" stroke="#d64f3a" stroke-width="2" transform="rotate(-4 283 44)"/>
    <text x="283" y="48" text-anchor="middle" fill="#ad3829" font-family="monospace" font-size="9" font-weight="700">EM OPERAÇÃO</text>

    <g transform="translate(28 132)" font-family="Arial, sans-serif">
      <text x="0" y="18" fill="#d64f3a" font-family="monospace" font-size="11">01</text>
      <text x="38" y="16" fill="#17251f" font-size="16" font-weight="700">WhatsApp</text>
      <text x="38" y="35" fill="#5c6c65" font-size="11">webhook autenticado</text>
      <rect x="286" y="5" width="37" height="21" rx="11" fill="none" stroke="#aebdb5"/>
      <text x="304.5" y="19" text-anchor="middle" fill="#3f7467" font-family="monospace" font-size="8">200</text>

      <path d="M0 56H323" stroke="#c9d4ce"/>
      <text x="0" y="87" fill="#d64f3a" font-family="monospace" font-size="11">02</text>
      <text x="38" y="85" fill="#17251f" font-size="16" font-weight="700">Atendimento + CRM</text>
      <text x="38" y="104" fill="#5c6c65" font-size="11">automação e handoff humano</text>

      <path d="M0 125H323" stroke="#c9d4ce"/>
      <text x="0" y="156" fill="#d64f3a" font-family="monospace" font-size="11">03</text>
      <text x="38" y="154" fill="#17251f" font-size="16" font-weight="700">Experiência do cliente</text>
      <text x="38" y="173" fill="#5c6c65" font-size="11">reservas · fidelidade · BI</text>

      <path d="M0 194H323" stroke="#c9d4ce"/>
      <text x="0" y="225" fill="#d64f3a" font-family="monospace" font-size="11">04</text>
      <text x="38" y="223" fill="#17251f" font-size="16" font-weight="700">Infra isolada</text>
      <text x="38" y="242" fill="#5c6c65" font-size="11">tenant · banco · domínio · TLS</text>
    </g>

    <text x="28" y="411" fill="#5c6c65" font-family="monospace" font-size="10">Node.js · PostgreSQL · Redis · Docker</text>
  </g>

  <text x="74" y="582" fill="#17251f" font-family="monospace" font-size="15">joaomoura.dev.br</text>
